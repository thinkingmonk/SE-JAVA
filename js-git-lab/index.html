<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCET Task Board</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="header__inner">
            <div>
                <p class="kicker">JavaScript lab</p>
                <h1>TCET Task Board</h1>
            </div>
            <button type="button" id="themeBtn" class="btn btn--ghost" aria-label="Toggle theme">Theme</button>
        </div>
    </header>

    <main class="container">
        <form id="taskForm" class="task-form">
            <input
                id="taskInput"
                type="text"
                placeholder="Enter a task…"
                maxlength="80"
                autocomplete="off"
                required
            >
            <button type="submit" class="btn btn--primary" id="addBtn">Add</button>
        </form>

        <p id="stats" class="stats">No tasks yet</p>

        <ul id="taskList" class="task-list" aria-live="polite"></ul>
        <p id="emptyMsg" class="empty-msg">Nothing here — add a task above.</p>
    </main>

    <script src="script.js"></script>
</body>
</html>
